<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Main</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/assets/css/main.css">
  </head>
  <body>
    <header class="site-header">
  <a href="/" class="logo">
	<img src="/assets/MaCS_Logo_Classic.svg" alt="MaCS Logo">
  </a>
	<nav class="site-nav">
	  <a href="/"  class="active" >						   Main()</a>
	  <a href="/events.html" > Events</a>
	  <a href="/about.html" > About</a>
	  <a href="/contact.html" > Contact</a>
	</nav>
</header>


    <section class="hero">
  <img src="/assets/MaCS_Hacks_Logo.svg" alt="MaCS Hacks Logo" class="hero-logo">
  <p class="hero-date">October 16-18</p>
  <a href="#" class="btn btn-primary", id="registerBtn">
	  <span class="corner corner-tl"></span>
	  <span class="corner corner-tr"></span>
	  <span class="corner corner-bl"></span>
	  <span class="corner corner-br"></span>
	 <svg class="btn-border">
		<rect class="btn-border-rect" fill="none" stroke="#F88344" stroke-width="3"
			  vector-effect="non-scaling-stroke">
		  <animate attributeName="stroke-dashoffset" from="0" to="-520" dur="3s" repeatCount="indefinite"/>
		</rect>
	  </svg>
	  REGISTER
  </a>
	<div class="arrow-down">
	  <span class="arrow-line"></span>
	  <span class="arrow-tip"></span>
	</div>

	<script>
	  function fitBorderToButton() {
		const btn = document.getElementById('registerBtn');
		const svg = btn.querySelector('.btn-border');
		const rect = btn.querySelector('.btn-border-rect');
		const w = btn.offsetWidth;
		const h = btn.offsetHeight;

		svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
		rect.setAttribute('x', 1.5);
		rect.setAttribute('y', 1.5);
		rect.setAttribute('width', w - 3);
		rect.setAttribute('height', h - 3);

		const perimeter = 2 * ((w - 3) + (h - 3));
		rect.setAttribute('pathLength', perimeter);
		rect.setAttribute('stroke-dasharray', `30 ${(perimeter - 60) / 2} 30 ${(perimeter - 60) / 2}`);
		document.querySelector('animate').setAttribute('to', -perimeter);
	  }

	  fitBorderToButton();
	  window.addEventListener('resize', fitBorderToButton);
	</script>
</section>

  </body>
</html>
