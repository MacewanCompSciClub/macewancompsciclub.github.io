	<script>
	  function fitBorderToButton(btn) {
		const svg = btn.querySelector('.btn-border');
		const rect = btn.querySelector('.btn-border-rect');
		const w = btn.offsetWidth;
		const h = btn.offsetHeight;
		const strokeWidth = 4;
		const inset = strokeWidth / 2;

		svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
		rect.setAttribute('x', inset);
		rect.setAttribute('y', inset);
		rect.setAttribute('width', w - strokeWidth);
		rect.setAttribute('height', h - strokeWidth);

		const perimeter = 2 * ((w - strokeWidth) + (h - strokeWidth));
		rect.setAttribute('pathLength', perimeter);
		rect.setAttribute('stroke-dasharray', `30 ${(perimeter - 60) / 2} 30 ${(perimeter - 60) / 2}`);
		svg.querySelector('animate').setAttribute('to', -perimeter);
	  }

	  function fitAllBorderButtons() {
		document.querySelectorAll('.border-btn').forEach(fitBorderToButton);
	  }

	  fitAllBorderButtons();
	  window.addEventListener('resize', fitAllBorderButtons);
	</script>
