<a href="{{ include.href }}" target="_blank" class="nav-link">
  <span class="nav-link-text">{{ include.name }}</span>
  <span class="nav-link-icon-wrap">
    <span class="nav-link-bracket">[</span>
    <span class="nav-link-icon">
      <img src="{{ include.icon | relative_url }}" alt="{{ include.name }}">
    </span>
    <span class="nav-link-bracket">]</span>
  </span>
</a>
