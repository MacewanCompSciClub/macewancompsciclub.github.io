<div class="framed-image" style="max-width: {{ include.width }}; aspect-ratio: {{ include.width | remove: 'px' }} / {{ include.height | remove: 'px' }};">
  <span class="corner corner-tl"></span>
  <span class="corner corner-tr"></span>
  <span class="corner corner-bl"></span>
  <span class="corner corner-br"></span>

  <span class="framed-image-label">{{ include.label }}</span>
  <div class="framed-image-crop">
	<img src="{{ include.src | relative_url }}" alt="{{ include.alt }}" style="object-position: {{ include.position | default: 'center center' }};">
  </div>
</div>
