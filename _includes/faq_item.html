<div class="faq-item">
  <button class="faq-question" type="button">
    <span>{{ include.question }}</span>
	<svg class="faq-icon" viewBox="0 0 24 24" width="24" height="24">
	  <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
	  <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
	</svg>
  </button>
  <div class="faq-answer">
    <p>{{ include.answer }}</p>
  </div>
</div>
